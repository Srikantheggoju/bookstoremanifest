apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: bookstore
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Srikantheggoju/bookstoremanifest.git
    targetRevision: HEAD
    path: helm-chart

  destination:
    server: https://kubernetes.default.svc
    namespace: bookstore2

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
