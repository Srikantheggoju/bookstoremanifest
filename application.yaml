apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: bookstore2

spec:
  destination:
    namespace: bookstore2
    server: https://kubernetes.default.svc

  source:
    repoURL: https://github.com/Srikantheggoju/manifestrepo.git
    targetRevision: HEAD
    path: helm-chart

  project: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
